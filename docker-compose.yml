services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: levla
      POSTGRES_PASSWORD: levla
      POSTGRES_DB: levla
    ports:
      - "5432:5432"
    volumes:
      - levla-pg:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - levla-audio:/app/backend/audio
    environment:
      DATABASE_URL: postgresql://levla:levla@postgres:5432/levla
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        NLP_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      NLP_BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  levla-pg:
  levla-audio:
