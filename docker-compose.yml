services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - levla-db:/data
    environment:
      DATABASE_URL: sqlite:////data/levla.db

  frontend:
    build:
      context: ./frontend
      args:
        NLP_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      NLP_BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  levla-db:
